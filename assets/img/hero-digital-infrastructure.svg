<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Illustration of a server rack connected to a cloud, representing physical and virtual infrastructure">
  <rect width="480" height="280" rx="10" fill="#eaf3ff"/>
  <!-- cloud -->
  <g transform="translate(280,50)">
    <ellipse cx="40" cy="40" rx="70" ry="34" fill="#ffffff" stroke="#a9c8f0" stroke-width="2"/>
    <ellipse cx="0" cy="46" rx="34" ry="24" fill="#ffffff" stroke="#a9c8f0" stroke-width="2"/>
    <ellipse cx="80" cy="46" rx="30" ry="22" fill="#ffffff" stroke="#a9c8f0" stroke-width="2"/>
  </g>
  <g stroke="#a9c8f0" stroke-width="2" fill="none">
    <path d="M150 150 C210 150 250 110 300 90"/>
  </g>
  <!-- server rack -->
  <g transform="translate(90,110)">
    <rect x="0" y="0" width="130" height="130" rx="6" fill="#0645ad"/>
    <g fill="#eaf3ff">
      <rect x="10" y="10" width="110" height="22" rx="3"/>
      <rect x="10" y="40" width="110" height="22" rx="3"/>
      <rect x="10" y="70" width="110" height="22" rx="3"/>
      <rect x="10" y="100" width="110" height="22" rx="3"/>
    </g>
    <circle cx="20" cy="21" r="3.5" fill="#33c17a"/>
    <circle cx="20" cy="51" r="3.5" fill="#33c17a"/>
    <circle cx="20" cy="81" r="3.5" fill="#f2b705"/>
    <circle cx="20" cy="111" r="3.5" fill="#33c17a"/>
  </g>
  <text x="240" y="252" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#54595d">Physical racks and virtual environments, working together</text>
</svg>
